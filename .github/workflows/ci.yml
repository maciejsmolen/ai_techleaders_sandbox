name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (.next/types) that `tsc` checks for the app.
      - run: npx next typegen
        working-directory: packages/app
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "branches", "functions", "statements"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
              console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

  integration:
    name: Integration tests (testcontainers + agent-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Ubuntu runners restrict unprivileged user namespaces, which Chrome's sandbox needs.
      AGENT_BROWSER_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Cache agent-browser's Chrome
        uses: actions/cache@v4
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chrome and its system libraries
        # `--with-deps` runs apt-get. A stalled mirror download once hung this
        # step for 10+ minutes, so apt gives up on silent connections and
        # retries, and each attempt is capped.
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network > /dev/null
          for attempt in 1 2 3; do
            timeout 5m npx agent-browser install --with-deps && exit 0
            echo "::warning::agent-browser install attempt $attempt failed; retrying"
          done
          exit 1
      - name: Run integration tests (PostgreSQL via testcontainers)
        timeout-minutes: 10
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-artifacts
          path: packages/app/integration/.artifacts/
          if-no-files-found: ignore
