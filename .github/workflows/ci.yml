name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (.next/types) that `tsc` checks for the app.
      - run: npx next typegen
        working-directory: packages/app
      - run: npm run typecheck

  unit:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "branches", "functions", "statements"]
                .map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
              console.log(["### Coverage", "| Metric | % | Covered |", "|---|---|---|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

  integration:
    name: Integration tests (testcontainers + agent-browser)
    runs-on: ubuntu-latest
    env:
      # Ubuntu runners restrict unprivileged user namespaces, which Chrome's sandbox needs.
      AGENT_BROWSER_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Cache agent-browser's Chrome
        uses: actions/cache@v4
        with:
          path: ~/.agent-browser/browsers
          key: agent-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chrome and its system libraries
        run: npx agent-browser install --with-deps
      - name: Run integration tests (PostgreSQL via testcontainers)
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-artifacts
          path: packages/app/integration/.artifacts/
          if-no-files-found: ignore
