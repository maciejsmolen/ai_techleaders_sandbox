# Local PostgreSQL for development: `docker compose up -d`
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/,
      # so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor -d devmentor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
